services:
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    volumes:
      - ./ml_service/models:/app/models:ro
      - ./ml_service/inference_results:/app/inference_results
    environment:
      GARMENT_MODEL_PATH: /app/models/detector.onnx
      GARMENT_CONF: "0.4"
      SAVE_INFERENCE_RESULTS: "true"
      INFERENCE_OUTPUT_DIR: /app/inference_results
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  tg-bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    container_name: tg-bot
    env_file:
      - .env
    environment:
      ML_SERVICE_URL: http://ml-service:8000/process
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped
