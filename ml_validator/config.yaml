# Пути считаются относительно этого config.yaml, если не указан абсолютный путь.
models:
  garment_model_path: models/garment_detector.onnx
  bad_classes_detector_path: models/bad_classes_detector.onnx

dataset:
  root: C:/MY_Data/Programming/Work/fashion/data/processed/detection
  split: val

yolo:
  input_size: 960
  iou_threshold: 0.45

  # Текущее поведение сервиса: оставлять все bbox после порога confidence.
  # Для экспериментов с OpenCV NMS можно поставить нужный флаг в true.
  garment_use_nms: false
  bad_classes_use_nms: false

thresholds:
  garment_conf: 0.25
  bad_class_conf: 0.35
  person_conf: 0.75

rules:
  # Важно: bed, chair, couch, dining table специально исключены из плохих классов.
  bad_class_names:
    - person
    - bicycle
    - car
    - motorcycle
    - airplane
    - bus
    - train
