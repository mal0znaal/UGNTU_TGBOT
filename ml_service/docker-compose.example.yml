services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wardrobe-ml-service:latest
    container_name: ml-service
    ports:
      - "8000:8000"
    environment:
      GARMENT_MODEL_PATH: /app/models/detector.onnx
      BAD_CLASSES_DETECTOR_PATH: /app/models/bad_classes_detector.onnx
      SAVE_INFERENCE_RESULTS: "true"
      INFERENCE_OUTPUT_DIR: /app/inference_results
      YOLO_INPUT_SIZE: 960
      YOLO_IOU_THRESHOLD: 0.45
      GARMENT_CONF: 0.25
      BAD_CLASS_CONF: 0.35
      PERSON_CONF: 0.75
    volumes:
      - ./models:/app/models:ro
      - ./inference_results:/app/inference_results
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

